name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  determinism:
    name: Determinism (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-24.04
            target: ''
          - name: aarch64
            os: ubuntu-24.04-arm
            target: ''
          - name: wasm32
            os: ubuntu-24.04
            target: wasm32-wasip1
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install wasmtime
        if: matrix.target == 'wasm32-wasip1'
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Determinism test (golden world hash)
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo test -p sim-core --test determinism --target ${{ matrix.target }} -- --nocapture
          else
            cargo test -p sim-core --test determinism -- --nocapture
          fi

  wasm:
    name: sim-wasm (browser build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack build crates/sim-wasm --target web

  ts:
    name: TypeScript (codegen, lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install flatc
        run: scripts/install-flatc.sh
      - name: Generated protocol code is current
        run: pnpm codegen:check
      - run: pnpm exec prettier --check .
      - run: pnpm exec turbo run lint typecheck test build --filter=!@relight/rust
